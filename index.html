<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <meta name="description" content="A simple website hosted on GitHub Pages.">
  <style>
    :root {
      --bg: #fbfbf8;
      --text: #1d2521;
      --muted: #55605a;
      --accent: #1f6f5c;
      --accent-text: #ffffff;
      --line: #dfe3dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131816;
        --text: #e8ece8;
        --muted: #9aa6a0;
        --accent: #4fb89d;
        --accent-text: #0e1512;
        --line: #29322e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    .site-header, .site-footer, main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
    }
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; color: var(--text); text-decoration: none; }
    nav a { margin-left: 1rem; color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--text); }
    .hero { padding: 4rem 0 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 0 0 1rem; }
    p { max-width: 60ch; color: var(--muted); }
    .button {
      display: inline-block;
      padding: .7rem 1.2rem;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .contact { padding: 2rem 0; border-top: 1px solid var(--line); }
    .site-footer { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }
    code { background: var(--line); padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">My Website</a>
    <nav>
      <a href="#home">Home</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <h1>Your website is live.</h1>
      <p>Edit <code>index.html</code>, commit the change, and GitHub Pages updates the site in a minute or two.</p>
      <a class="button" href="#contact">Get in touch</a>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p>Replace this with your email or social links.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> My Website</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
